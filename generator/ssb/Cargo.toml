[package]
name = "populate-ssb"
description = "Star Schema Benchmark (SSB) data byte-identical to ssb-dbgen, on all cores: Arrow, Parquet or .tbl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# the CLI's allocator (feature `mimalloc`, on by default; the library
# itself doesn't use it)
mimalloc = { version = "0.1", default-features = false, optional = true }
populate-core = { workspace = true }
populate-builtins = { workspace = true }
populate-sink-arrow = { workspace = true }
populate-table = { workspace = true, features = ["parquet"] }
rand = { workspace = true }
# dbgen's skip-ahead Lehmer streams
populate-combinators = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
arrow-buffer = { workspace = true }
parquet = { workspace = true, features = ["arrow", "snap"] }
# dbgen's distributions (SSB's dists.dss values are TPC-H's), Apache-2.0
tpchgen = "4.0"

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[dev-dependencies]
arrow-select = "60"
bytes = "1"

[[bin]]
name = "ssb-gen"
path = "src/bin/ssb-gen.rs"
