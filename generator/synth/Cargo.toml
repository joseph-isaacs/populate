[package]
name = "populate-gen-synth"
publish = false
description = "Synthetic dataset shapes on populate-table: taxi trips, web hits, ML features and vector embeddings, deterministic on all cores"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

[dependencies]
# the CLI's allocator (feature `mimalloc`, on by default; the library
# itself doesn't use it)
mimalloc = { version = "0.1", default-features = false, optional = true }
populate-core = { workspace = true }
populate-builtins = { workspace = true }
populate-sink-arrow = { workspace = true, optional = true }
populate-table = { workspace = true, features = ["parquet"], optional = true }
rand = { workspace = true }
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
arrow-buffer = { workspace = true, optional = true }
parquet = { workspace = true, features = ["arrow", "snap"], optional = true }

[features]
formats = ["dep:populate-sink-arrow", "dep:populate-table", "dep:arrow-array", "dep:arrow-schema", "dep:arrow-buffer", "dep:parquet"]
default = ["formats", "mimalloc"]
mimalloc = ["dep:mimalloc"]

[dev-dependencies]
divan = { workspace = true }
bytes = "1"
arrow-select = "60"
arrow-data = "60"

[[bin]]
required-features = ["formats"]
name = "synth-gen"
path = "src/bin/synth-gen.rs"

[[bench]]
required-features = ["formats"]
name = "synth"
harness = false

[[test]]
name = "determinism"
required-features = ["formats"]
