[package]
name = "populate-tpch"
description = "TPC-H data byte-identical to dbgen/tpchgen, on all cores: Arrow, Parquet or .tbl"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# the CLI's allocator (feature `mimalloc`, on by default; the library
# itself doesn't use it)
mimalloc = { version = "0.1", default-features = false, optional = true }
populate-core = { workspace = true }
populate-builtins = { workspace = true }
populate-combinators = { workspace = true }
populate-sink-arrow = { workspace = true }
populate-table = { workspace = true, features = ["parquet"] }
rand = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
arrow-buffer = { workspace = true }
parquet = { workspace = true, features = ["arrow", "snap"] }
# dbgen's distributions and text grammar, and the reference generator the
# tests compare against (Apache-2.0, tpcgen-rs project)
tpchgen = "4.0"

[target.'cfg(target_os = "linux")'.dependencies]
# madvise, to put the text pool on huge pages
libc = "0.2"

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[dev-dependencies]
arrow-select = "60"
divan = { workspace = true }
tpchgen-arrow = "4.0"
bytes = "1"

[[bin]]
name = "tpch-gen"
path = "src/bin/tpch-gen.rs"

[[bench]]
name = "tpch"
harness = false
