[package]
name = "populate-gen-dsb"
publish = false
description = "DSB (skewed, correlated TPC-DS) data byte-identical to Microsoft's DSB dsdgen, on all cores: Arrow, Parquet or .dat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

[dependencies]
# the CLI's allocator (feature `mimalloc`, on by default; the library
# itself doesn't use it)
mimalloc = { version = "0.1", default-features = false, optional = true }
populate-combinators = { path = "../combinators", version = "0.1.0", default-features = false }
populate-core = { workspace = true }
populate-builtins = { workspace = true }
populate-sink-arrow = { workspace = true, optional = true }
populate-table = { workspace = true, features = ["parquet"], optional = true }
rand = { workspace = true }
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
arrow-select = { version = "60", optional = true }
parquet = { workspace = true, features = ["arrow", "snap"], optional = true }
# tpcdsgen 4.0 (Apache-2.0, tpcgen-rs project) with DSB's dsdgen changes
dsbgen = { path = "dsbgen" }
dsbgen-arrow = { path = "dsbgen-arrow", optional = true }

[features]
formats = ["dep:populate-sink-arrow", "dep:populate-table", "dep:arrow-array", "dep:arrow-schema", "dep:arrow-select", "dep:parquet", "dep:dsbgen-arrow", "populate-combinators/formats"]
default = ["formats", "mimalloc"]
mimalloc = ["dep:mimalloc"]

[dev-dependencies]
divan = { workspace = true }
arrow-cast = { workspace = true }
bytes = "1"

[[bin]]
required-features = ["formats"]
name = "dsb-gen"
path = "src/bin/dsb-gen.rs"

[[bench]]
required-features = ["formats"]
name = "dsb"
harness = false

[[test]]
name = "tables"
required-features = ["formats"]

[[example]]
name = "vs_tpcdsgen"
required-features = ["formats"]

[[example]]
name = "stages"
required-features = ["formats"]
