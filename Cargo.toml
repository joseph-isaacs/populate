[workspace]
members = [
    "populate",
    "populate-core",
    "populate-builtins",
    "populate-sink-vec",
    "populate-sink-arrow",
    "populate-sink-json",
    "examples",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
rand = "0.9"
arrow = {version = "57.2.0"}
arrow-array = "57"
arrow-schema = "57"
arrow-cast = "57"
serde_json = "1"
populate-core = { path = "populate-core" }
populate-builtins = { path = "populate-builtins" }
populate-sink-vec = { path = "populate-sink-vec" }
populate-sink-arrow = { path = "populate-sink-arrow" }
populate-sink-json = { path = "populate-sink-json" }
