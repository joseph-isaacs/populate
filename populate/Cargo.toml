[package]
name = "populate"
description = "Sampling combinators for columnar data generation"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
populate-core = { workspace = true }
populate-builtins = { workspace = true }
populate-sink-arrow = { workspace = true, optional = true }
populate-sink-parquet = { workspace = true, optional = true }

[features]
default = ["arrow"]
arrow = ["dep:populate-sink-arrow"]
parquet = ["arrow", "dep:populate-sink-parquet"]

[dev-dependencies]
rand = { workspace = true }
divan = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
parquet = { workspace = true, features = ["arrow"] }
bytes = "1"
rand_distr = "0.5"
arrow-cast = { version = "57", features = ["prettyprint"] }

[[test]]
name = "zero_copy"
required-features = ["arrow"]

[[bench]]
name = "collect"
harness = false

[[bench]]
name = "arrow"
harness = false
required-features = ["arrow"]
