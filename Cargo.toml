[workspace]
members = [
    "populate",
    "populate-core",
    "populate-builtins",
    "populate-sink-arrow",
    "populate-sink-parquet",
    "populate-table",
    "populate-tpcds",
    "populate-tpch",
    "populate-ssb",
    "populate-oltp",
    "populate-synth",
    "populate-bench",
]
# `cargo build` / `cargo test` at the root skip the tpchgen comparison crate
# (benchmark-only dependencies). Run it with
# `cargo bench -p populate-bench` or `cargo run -p populate-bench --release`.
default-members = [
    "populate",
    "populate-core",
    "populate-builtins",
    "populate-sink-arrow",
    "populate-sink-parquet",
    "populate-table",
    "populate-tpcds",
    "populate-tpch",
    "populate-ssb",
    "populate-oltp",
    "populate-synth",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
divan = "0.1"
rand = "0.9"
arrow-array = "60"
arrow-schema = "60"
arrow-buffer = "60"
arrow-cast = "60"
parquet = { version = "60", default-features = false }
populate = { path = "populate" }
populate-core = { path = "populate-core" }
populate-builtins = { path = "populate-builtins" }
populate-sink-arrow = { path = "populate-sink-arrow" }
populate-sink-parquet = { path = "populate-sink-parquet" }
populate-table = { path = "populate-table" }
populate-tpcds = { path = "populate-tpcds" }
populate-tpch = { path = "populate-tpch" }
populate-ssb = { path = "populate-ssb" }
populate-oltp = { path = "populate-oltp" }
populate-synth = { path = "populate-synth" }

# Benchmarks: one codegen unit so inlining/layout is deterministic run to run
# (populate is generic, so everything is monomorphised into the bench crate
# anyway). Debug info is for `perf`/flamegraphs and doesn't change codegen.
[profile.bench]
codegen-units = 1
debug = true
