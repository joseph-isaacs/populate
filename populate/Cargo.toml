[package]
name = "populate"
description = "Sampling combinators for columnar data generation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../README.md"
license.workspace = true

[dependencies]
populate-core = { workspace = true }
populate-builtins = { workspace = true }
populate-sink-arrow = { workspace = true, optional = true }
populate-sink-parquet = { workspace = true, optional = true }
populate-table = { workspace = true, optional = true }

[features]
default = ["arrow", "table"]
arrow = ["dep:populate-sink-arrow"]
parquet = ["arrow", "dep:populate-sink-parquet", "populate-table?/parquet"]
table = ["arrow", "dep:populate-table"]

[dev-dependencies]
rand = { workspace = true }
divan = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
parquet = { workspace = true, features = ["arrow"] }
bytes = "1"
arrow-cast = { workspace = true, features = ["prettyprint"] }

[[test]]
name = "zero_copy"
required-features = ["arrow"]

[[bench]]
name = "collect"
harness = false

[[bench]]
name = "arrow"
harness = false
required-features = ["arrow"]

[[bench]]
name = "leaves"
harness = false

[package.metadata.docs.rs]
all-features = true
