[package]
name = "populate-gen-tpcds"
description = "TPC-DS data byte-identical to dsdgen, on all cores: Arrow, Parquet or .dat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
license = "MIT AND Apache-2.0"

[dependencies]
# the CLI's allocator (feature `mimalloc`, on by default; the library
# itself doesn't use it)
mimalloc = { version = "0.1", default-features = false, optional = true }
populate-core = { workspace = true }
populate-builtins = { workspace = true }
populate-combinators = { path = "../combinators", version = "0.1.0", default-features = false }
populate-sink-arrow = { workspace = true, optional = true }
populate-table = { workspace = true, features = ["parquet"], optional = true }
rand = { workspace = true }
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
arrow-buffer = { workspace = true, optional = true }
arrow-select = { version = "60", optional = true }
parquet = { workspace = true, features = ["arrow", "snap"], optional = true }
# dsdgen's logic, ported to Rust (Apache-2.0, tpcgen-rs project)
tpcdsgen = "4.0"

[features]
formats = ["dep:populate-sink-arrow", "dep:populate-table", "dep:arrow-array", "dep:arrow-schema", "dep:arrow-buffer", "dep:arrow-select", "dep:parquet", "populate-combinators/formats"]
default = ["formats", "mimalloc"]
mimalloc = ["dep:mimalloc"]

[dev-dependencies]
# tpcdsgen's own Arrow conversion: the reference the tables are tested
# against
tpcdsgen-arrow = "4.0"
divan = { workspace = true }
arrow-cast = { workspace = true }
bytes = "1"

[[bin]]
required-features = ["formats"]
name = "tpcds-gen"
path = "src/bin/tpcds-gen.rs"

[[bench]]
required-features = ["formats"]
name = "tpcds"
harness = false

[[test]]
name = "tables"
required-features = ["formats"]

[[example]]
name = "ds_columns"
required-features = ["formats"]

[[example]]
name = "datbench"
required-features = ["formats"]

[[example]]
name = "vs_tpcdsgen"
required-features = ["formats"]

[[example]]
name = "stages"
required-features = ["formats"]
