[package]
name = "populate-combinators"
description = "Distributions shared by populate's benchmark generators: dbgen's and dsdgen's skip-ahead Lehmer streams, Utf8View columns over shared buffers, dsdgen's GMT offsets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

[dependencies]
populate-core = { workspace = true }
populate-builtins = { workspace = true }
populate-sink-arrow = { workspace = true, optional = true }
populate-table = { workspace = true, optional = true }
rand = { workspace = true }
arrow-array = { workspace = true, optional = true }
arrow-buffer = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }

[dev-dependencies]
# dbgen's streams as ported by tpchgen, to check against
tpchgen = "4.0"

[features]
default = ["formats"]
formats = ["dep:populate-sink-arrow", "dep:populate-table", "dep:arrow-array", "dep:arrow-buffer", "dep:arrow-schema"]
