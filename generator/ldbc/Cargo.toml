[package]
name = "populate-ldbc"
description = "LDBC SNB data identical to the LDBC Spark datagen, on all cores: CSV, Arrow or Parquet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
license = "MIT AND Apache-2.0 AND SunPro"

[dependencies]
populate-core = { workspace = true }
populate-builtins = { workspace = true }
populate-sink-arrow = { workspace = true }
populate-table = { workspace = true, features = ["parquet"] }
rand = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
# Java's Normalizer (NFD) for the datagen's e-mail addresses
unicode-normalization = "0.1"

[[bin]]
name = "ldbc-gen"
path = "src/bin/ldbc-gen.rs"
