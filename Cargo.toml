[workspace]
members = [
    #    "populate",
    "populate-2",
    "populate-2-tpch",
    "populate-2-tpcds",
    #    "populate-core",
    #    "populate-builtins",
    #    "populate-builtins-tpch",
    #    "populate-derive",
    #    "populate-sink-vec",
    #    "populate-sink-json",
    #    "examples",
    #    "tpch",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
divan = "0.1"
rand = "0.9"
arrow = { version = "60" }
arrow-array = "60"
arrow-schema = "60"
arrow-buffer = "60"
arrow-cast = "60"
serde_json = "1"
tpchgen = "4.0"
tpchgen-arrow = "4.0"
populate-2 = { path = "populate-2" }
tpcdsgen = "4.0"
tpcdsgen-arrow = "4.0"
parquet = { version = "60", default-features = false, features = ["arrow", "snap", "zstd"] }

#populate-core = { path = "populate-core" }
#populate-derive = { path = "populate-derive" }
#populate-builtins = { path = "populate-builtins" }
#populate-builtins-tpch = { path = "populate-builtins-tpch" }
#populate-sink-vec = { path = "populate-sink-vec" }
#populate-sink-json = { path = "populate-sink-json" }
#
# Benchmarks: one codegen unit so inlining/layout is deterministic run to run
# (populate-2 is generic, so everything is monomorphised into the bench crate
# anyway). Debug info is for `perf`/flamegraphs and doesn't change codegen.
[profile.bench]
codegen-units = 1
debug = true
