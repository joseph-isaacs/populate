[workspace]
members = [
    "populate",
    "populate-core",
    "populate-builtins",
    "sink/arrow",
    "sink/parquet",
    "populate-table",
    "generator/combinators",
    "generator/tpcds",
    "generator/tpch",
    "generator/tsbs",
    "generator/ssb",
    "generator/h2o",
    "generator/tpcc",
    "generator/ycsb",
    "generator/synth",
    "generator/dsb",
    "generator/dsb/dsbgen",
    "generator/dsb/dsbgen-arrow",
    "generator/ldbc",
    "populate-bench",
    "python",
    "xtask",
]
# `cargo build` / `cargo test` at the root skip the tpchgen comparison crate
# (benchmark-only dependencies). Run it with
# `cargo bench -p populate-bench` or `cargo run -p populate-bench --release`.
default-members = [
    "populate",
    "populate-core",
    "populate-builtins",
    "sink/arrow",
    "sink/parquet",
    "populate-table",
    "generator/combinators",
    "generator/tpcds",
    "generator/tpch",
    "generator/tsbs",
    "generator/ssb",
    "generator/h2o",
    "generator/tpcc",
    "generator/ycsb",
    "generator/synth",
    "generator/dsb",
    "generator/dsb/dsbgen",
    "generator/dsb/dsbgen-arrow",
    "generator/ldbc",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/joseph-isaacs/populate"
keywords = ["data-generation", "benchmark", "arrow", "parquet", "tpch"]
categories = ["development-tools::testing", "database"]

[workspace.dependencies]
divan = "0.1"
rand = "0.9"
arrow-array = "60"
arrow-schema = "60"
arrow-buffer = "60"
arrow-cast = "60"
parquet = { version = "60", default-features = false }
populate = { path = "populate", version = "0.1.0" }
populate-core = { path = "populate-core", version = "0.1.0" }
populate-builtins = { path = "populate-builtins", version = "0.1.0" }
populate-sink-arrow = { path = "sink/arrow", version = "0.1.0" }
populate-sink-parquet = { path = "sink/parquet", version = "0.1.0" }
populate-table = { path = "populate-table", version = "0.1.0" }
populate-combinators = { path = "generator/combinators", version = "0.1.0" }
populate-tpcds = { path = "generator/tpcds", version = "0.1.0" }
populate-tpch = { path = "generator/tpch", version = "0.1.0" }
populate-tsbs = { path = "generator/tsbs", version = "0.1.0" }
populate-ssb = { path = "generator/ssb", version = "0.1.0" }
populate-h2o = { path = "generator/h2o", version = "0.1.0" }
populate-tpcc = { path = "generator/tpcc", version = "0.1.0" }
populate-ycsb = { path = "generator/ycsb", version = "0.1.0" }
populate-synth = { path = "generator/synth", version = "0.1.0" }
populate-ldbc = { path = "generator/ldbc", version = "0.1.0" }

# populate-ldbc's tests generate ~2 GB of data: optimise the crate itself
# in test builds too (its dependencies stay as they are)
[profile.dev.package.populate-ldbc]
opt-level = 3

# Thin LTO: lets small hot functions of dependencies (tpcdsgen's random
# streams and decimals) inline into the generators; ~7% off a TPC-DS .dat
# run, for a little more link time.
[profile.release]
lto = "thin"

# Benchmarks: one codegen unit so inlining/layout is deterministic run to run
# (populate is generic, so everything is monomorphised into the bench crate
# anyway). Debug info is for `perf`/flamegraphs and doesn't change codegen.
[profile.bench]
codegen-units = 1
debug = true

# populate-h2o's tests generate the 1e7-row join tables (the smallest the
# datagen allows); unoptimised that takes minutes.
[profile.test.package.populate-h2o]
opt-level = 3
