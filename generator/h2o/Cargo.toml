[package]
name = "populate-gen-h2o"
publish = false
description = "H2O db-benchmark groupby and join data byte-identical to the R datagen scripts, on all cores: Arrow, Parquet or CSV"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
license = "GPL-2.0-or-later AND MPL-2.0"

[dependencies]
populate-core = { workspace = true }
populate-builtins = { workspace = true }
populate-sink-arrow = { workspace = true }
rand = { workspace = true }
populate-table = { workspace = true, features = ["parquet"] }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
arrow-buffer = { workspace = true }
parquet = { workspace = true, features = ["arrow", "snap"] }

[dev-dependencies]
divan = { workspace = true }

[[bin]]
name = "h2o-gen"
path = "src/bin/h2o-gen.rs"

[[bench]]
name = "h2o"
harness = false
