[package]
name = "populate-gen-tpch"
description = "TPC-H data byte-identical to dbgen/tpchgen, on all cores: Arrow, Parquet or .tbl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

[dependencies]
# the CLI's allocator (feature `mimalloc`, on by default; the library
# itself doesn't use it)
mimalloc = { version = "0.1", default-features = false, optional = true }
populate-core = { workspace = true }
populate-builtins = { workspace = true }
populate-combinators = { path = "../combinators", version = "0.1.0", default-features = false }
populate-sink-arrow = { workspace = true, optional = true }
populate-table = { workspace = true, features = ["parquet"], optional = true }
rand = { workspace = true }
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
arrow-buffer = { workspace = true, optional = true }
parquet = { workspace = true, features = ["arrow", "snap"], optional = true }
# dbgen's distributions and text grammar, and the reference generator the
# tests compare against (Apache-2.0, tpcgen-rs project)
tpchgen = "4.0"

[target.'cfg(target_os = "linux")'.dependencies]
# madvise, to put the text pool on huge pages
libc = "0.2"

[features]
formats = ["dep:populate-sink-arrow", "dep:populate-table", "dep:arrow-array", "dep:arrow-schema", "dep:arrow-buffer", "dep:parquet", "populate-combinators/formats"]
default = ["formats", "mimalloc"]
mimalloc = ["dep:mimalloc"]

[dev-dependencies]
arrow-select = "60"
divan = { workspace = true }
tpchgen-arrow = "4.0"
bytes = "1"

[[bin]]
required-features = ["formats"]
name = "tpch-gen"
path = "src/bin/tpch-gen.rs"

[[bench]]
required-features = ["formats"]
name = "tpch"
harness = false

[[test]]
name = "tables"
required-features = ["formats"]

[[example]]
name = "tpch_stages"
required-features = ["formats"]

[[example]]
name = "tpch_columns"
required-features = ["formats"]
