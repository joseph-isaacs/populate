[package]
name = "populate-gen-ldbc"
description = "LDBC SNB data identical to the LDBC Spark datagen, on all cores: CSV, Arrow or Parquet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
license = "MIT AND Apache-2.0 AND SunPro"

[dependencies]
populate-core = { workspace = true }
populate-builtins = { workspace = true }
populate-sink-arrow = { workspace = true, optional = true }
populate-table = { workspace = true, features = ["parquet"], optional = true }
rand = { workspace = true }
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
# Java's Normalizer (NFD) for the datagen's e-mail addresses
unicode-normalization = "0.1"

[[bin]]
required-features = ["formats"]
name = "ldbc-gen"
path = "src/bin/ldbc-gen.rs"

[features]
formats = ["dep:populate-sink-arrow", "dep:populate-table", "dep:arrow-array", "dep:arrow-schema"]
default = ["formats"]

[[test]]
name = "modes"
required-features = ["formats"]

[[test]]
name = "output"
required-features = ["formats"]
