[workspace]
members = [
    "populate",
    "populate-core",
    "populate-builtins",
    "populate-sink-arrow",
    "populate-sink-parquet",
    "populate-bench",
]
# `cargo build` / `cargo test` at the root skip the tpchgen comparison crate
# (it pulls in a second arrow/parquet major version). Run it with
# `cargo bench -p populate-bench` or `cargo run -p populate-bench --release`.
default-members = [
    "populate",
    "populate-core",
    "populate-builtins",
    "populate-sink-arrow",
    "populate-sink-parquet",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
divan = "0.1"
rand = "0.9"
arrow-array = "57"
arrow-schema = "57"
arrow-buffer = "57"
parquet = { version = "57", default-features = false }
populate = { path = "populate" }
populate-core = { path = "populate-core" }
populate-builtins = { path = "populate-builtins" }
populate-sink-arrow = { path = "populate-sink-arrow" }
populate-sink-parquet = { path = "populate-sink-parquet" }

# Benchmarks: one codegen unit so inlining/layout is deterministic run to run
# (populate is generic, so everything is monomorphised into the bench crate
# anyway). Debug info is for `perf`/flamegraphs and doesn't change codegen.
[profile.bench]
codegen-units = 1
debug = true
