[package]
name = "populate-ycsb"
description = "YCSB load and run operations, byte-identical to YCSB 0.17.0, on all cores: Arrow, Parquet or TSV"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
license = "MIT AND Apache-2.0"

[dependencies]
# the CLI's allocator (feature `mimalloc`, on by default; the library
# itself doesn't use it)
mimalloc = { version = "0.1", default-features = false, optional = true }
populate-core = { workspace = true }
populate-combinators = { workspace = true }
populate-table = { workspace = true, features = ["parquet"] }
rand = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
parquet = { workspace = true, features = ["arrow", "snap"] }
itoa = "1"

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[dev-dependencies]
divan = { workspace = true }

[[bin]]
name = "ycsb-gen"
path = "src/bin/ycsb-gen.rs"

[[bench]]
name = "ycsb"
harness = false
